swagger: "2.0"
info:
  title: auth/v1/auth.proto
  version: version not set
tags:
  - name: AuthService
  - name: UserService
consumes:
  - application/json
produces:
  - application/json
paths:
  /user:
    get:
      summary: |-
        List returns a list of users.
        Returns the user in an array.
      operationId: List
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: limit
          description: maximum number of results to return
          in: query
          required: false
          type: integer
          format: int32
        - name: offset
          description: offset rows to skip before returning rows
          in: query
          required: false
          type: integer
          format: int32
        - name: disabled
          description: inactivated flag to filter the users to return
          in: query
          required: false
          type: boolean
      tags:
        - UserService
    post:
      summary: |-
        Create creates a new user.
        Creates a new user.
      operationId: Create
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: user
          description: User to add
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1User'
      tags:
        - UserService
  /user/by-external-id/{externalId}:
    get:
      summary: |-
        GetByExternalId returns a user having an externalId or nothing if not found.
        Returns the user.
      operationId: GetByExternalId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetByExternalIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: externalId
          description: externalId of the user needed
          in: path
          required: true
          type: integer
          format: int32
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - UserService
  /user/count:
    get:
      summary: |-
        Count returns the number of user based on search criterias.
        Returns the number of users found after filtering with passed criterias.
      operationId: Count
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CountResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: inactivated
          in: query
          required: false
          type: boolean
      tags:
        - UserService
  /user/{id}:
    get:
      summary: |-
        Get retrieves in backend all information about a specific userId.
        Retrieve a specific user.
      operationId: Get
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Id of the user
          in: path
          required: true
          type: string
      tags:
        - UserService
    delete:
      summary: |-
        Delete allows to delete a specific userId.
        delete a user.
      operationId: Delete
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Id of the user
          in: path
          required: true
          type: string
      tags:
        - UserService
    put:
      summary: |-
        Update allows to modify information about a specific userId.
        Updates the status of a user.
      operationId: Update
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Id of the user
          in: path
          required: true
          type: string
        - name: user
          description: informations related to the user
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1User'
      tags:
        - UserService
  /v1/auth/callback:
    post:
      operationId: OAuthCallback
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1OAuthCallbackResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1OAuthCallbackRequest'
      tags:
        - AuthService
  /v1/auth/currentUser:
    get:
      operationId: GetCurrentUser
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetCurrentUserResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - AuthService
  /v1/auth/introspect:
    post:
      summary: |-
        IntrospectToken verifies an opaque token (personal access token) and
        returns the identity and scopes attached to it. Public endpoint: the
        token itself is the credential (RFC 7662 style, without client auth).
      operationId: IntrospectToken
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1IntrospectTokenResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1IntrospectTokenRequest'
      tags:
        - AuthService
  /v1/auth/start:
    post:
      operationId: StartOAuth
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1StartOAuthResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1StartOAuthRequest'
      tags:
        - AuthService
  /v1/auth/tokens:
    get:
      summary: ListPersonalAccessTokens lists the current user's PATs (metadata only).
      operationId: ListPersonalAccessTokens
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListPersonalAccessTokensResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - AuthService
    post:
      summary: |-
        CreatePersonalAccessToken creates a long-lived PAT for the current user.
        The full token value is returned exactly once and never stored.
      operationId: CreatePersonalAccessToken
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreatePersonalAccessTokenResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreatePersonalAccessTokenRequest'
      tags:
        - AuthService
  /v1/auth/tokens/{id}:
    delete:
      summary: RevokePersonalAccessToken revokes one of the current user's PATs.
      operationId: RevokePersonalAccessToken
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RevokePersonalAccessTokenResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - AuthService
  /v1/auth/validateToken:
    post:
      operationId: ValidateToken
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ValidateTokenResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1ValidateTokenRequest'
      tags:
        - AuthService
definitions:
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1CountResponse:
    type: object
    properties:
      count:
        type: integer
        format: int32
  v1CreatePersonalAccessTokenRequest:
    type: object
    properties:
      name:
        type: string
      scopes:
        type: array
        items:
          type: string
      expiresInDays:
        type: integer
        format: int32
        title: 0 means the token never expires
    required:
      - name
  v1CreatePersonalAccessTokenResponse:
    type: object
    properties:
      token:
        type: string
        title: full token value, shown exactly once
      info:
        $ref: '#/definitions/v1PersonalAccessTokenInfo'
  v1CreateResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
  v1DeleteResponse:
    type: object
    title: Empty, maps to 204 No Content typically
  v1GetByExternalIdResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
  v1GetCurrentUserResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
  v1GetResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
  v1IntrospectTokenRequest:
    type: object
    properties:
      token:
        type: string
    title: Token introspection (PATs)
    required:
      - token
  v1IntrospectTokenResponse:
    type: object
    properties:
      active:
        type: boolean
      userId:
        type: string
        format: int64
        title: legacy integer user id (alternate_app_id), what modules use as owner id
      email:
        type: string
      name:
        type: string
      scopes:
        type: array
        items:
          type: string
      expiresAt:
        type: string
        format: date-time
  v1ListPersonalAccessTokensResponse:
    type: object
    properties:
      tokens:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1PersonalAccessTokenInfo'
  v1ListResponse:
    type: object
    properties:
      users:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1UserList'
  v1OAuthCallbackRequest:
    type: object
    properties:
      provider:
        type: string
      code:
        type: string
      state:
        type: string
  v1OAuthCallbackResponse:
    type: object
    properties:
      jwt:
        type: string
      user:
        $ref: '#/definitions/v1User'
  v1PersonalAccessTokenInfo:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      prefix:
        type: string
        title: displayable first characters of the token, e.g. "pat_a1B2c3D4"
      scopes:
        type: array
        items:
          type: string
      createdAt:
        type: string
        format: date-time
        readOnly: true
      expiresAt:
        type: string
        format: date-time
      lastUsedAt:
        type: string
        format: date-time
        readOnly: true
      revoked:
        type: boolean
    description: Metadata of a personal access token (never contains the token value).
  v1RevokePersonalAccessTokenResponse:
    type: object
  v1StartOAuthRequest:
    type: object
    properties:
      provider:
        type: string
        title: google, github, microsoft
      redirectUrl:
        type: string
        title: optionnel
    title: OAuth Login Flow
  v1StartOAuthResponse:
    type: object
    properties:
      authUrl:
        type: string
      state:
        type: string
        title: anti-CSRF
  v1UpdateResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
  v1User:
    type: object
    properties:
      id:
        type: string
        title: |-
          identifiant uuid v4
          cet Universally unique identifier (UUID) sera généré automatiquement pour vous
      externalId:
        type: string
        format: int64
        title: identifiant numérique externe legacy
      email:
        type: string
      name:
        type: string
      avatarUrl:
        type: string
      provider:
        type: string
      disabled:
        type: boolean
      roles:
        type: array
        items:
          type: string
      createdAt:
        type: string
        format: date-time
        title: date de création de cet enregistrement dans la base
        readOnly: true
      lastLoginAt:
        type: string
        format: date-time
        readOnly: true
    title: Messages principaux
    required:
      - id
      - email
      - name
      - disabled
  v1UserList:
    type: object
    properties:
      id:
        type: string
      externalId:
        type: string
        format: int64
      email:
        type: string
      name:
        type: string
      disabled:
        type: boolean
      createdAt:
        type: string
        format: date-time
        readOnly: true
      lastLoginAt:
        type: string
        format: date-time
        readOnly: true
    title: A light version of User for lists
    required:
      - id
      - email
      - name
      - disabled
  v1ValidateTokenRequest:
    type: object
    properties:
      token:
        type: string
    title: Token validation
  v1ValidateTokenResponse:
    type: object
    properties:
      valid:
        type: boolean
      user:
        $ref: '#/definitions/v1User'
