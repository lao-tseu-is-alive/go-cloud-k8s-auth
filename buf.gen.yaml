version: v2
plugins:
  # 1. Generate Go Code (gRPC + Models)
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative

  # 2. Generate ConnectRPC Code (Interfaces for HTTP)
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
      - simple

  # 3. Generate OpenAPI (The Verification Step)
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: api/openapi
    opt:
      - json_names_for_fields=true  # Forces camelCase (standard JSON)
      - output_format=yaml
      - allow_merge=true
      - merge_file_name=auth
      - simple_operation_ids=true   # Makes operation IDs cleaner (e.g. "List" instead of "goCloudDocumentService_List")
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lao-tseu-is-alive/go-cloud-k8s-auth/gen
