<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Personal Access Tokens</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-main);
            min-height: 100vh; padding: 2rem; display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 820px; }
        h1 { font-size: 1.6rem; margin-bottom: .25rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: .95rem; }
        .card { background: var(--bg-secondary); border: 1px solid var(--glass-border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.05rem; margin-bottom: 1rem; color: #c084fc; }
        label { display: block; font-size: .85rem; color: var(--text-muted); margin: .6rem 0 .25rem; }
        input, select {
            width: 100%; padding: .55rem .7rem; border-radius: 8px; border: 1px solid var(--glass-border);
            background: #0b1222; color: var(--text-main); font-size: .95rem;
        }
        button {
            margin-top: 1rem; padding: .6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer;
            background: var(--accent-blue); color: #fff; font-weight: 600; font-size: .95rem;
        }
        button.danger { background: var(--accent-red); padding: .35rem .8rem; margin: 0; font-size: .85rem; }
        button:disabled { opacity: .5; cursor: default; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-weight: 500; }
        .mono { font-family: ui-monospace, monospace; }
        .badge { padding: .15rem .5rem; border-radius: 6px; font-size: .78rem; }
        .badge.active { background: rgba(16,185,129,.15); color: var(--accent-green); }
        .badge.revoked { background: rgba(239,68,68,.15); color: var(--accent-red); }
        #new-token-box {
            display: none; margin-top: 1rem; padding: 1rem; border-radius: 10px;
            background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.4);
        }
        #new-token-box p { font-size: .85rem; color: var(--text-muted); margin-bottom: .5rem; }
        #new-token-value { word-break: break-all; font-weight: 600; color: var(--accent-green); }
        #login-prompt { display: none; text-align: center; padding: 3rem 1rem; }
        #login-prompt a {
            display: inline-block; margin-top: 1rem; padding: .7rem 1.6rem; border-radius: 10px;
            background: var(--accent-blue); color: #fff; text-decoration: none; font-weight: 600;
        }
        #error-box { display: none; color: var(--accent-red); margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Personal Access Tokens</h1>
    <p class="subtitle">Long-lived tokens for MCP clients and scripts. Treat them like passwords.</p>
    <div id="error-box"></div>

    <div id="login-prompt">
        <p>You need to sign in to manage your tokens.</p>
        <a href="/auth/login?redirect_uri=%2Ftokens.html">Sign in</a>
    </div>

    <div id="content" style="display:none">
        <div class="card">
            <h2>Create a new token</h2>
            <label for="token-name">Name</label>
            <input id="token-name" placeholder="e.g. claude-mcp-laptop" maxlength="100"/>
            <label for="token-expiry">Expires</label>
            <select id="token-expiry">
                <option value="0">Never</option>
                <option value="30">30 days</option>
                <option value="90" selected>90 days</option>
                <option value="365">1 year</option>
            </select>
            <button id="create-btn">Create token</button>
            <div id="new-token-box">
                <p>Copy your token now &mdash; it will not be shown again.</p>
                <span id="new-token-value" class="mono"></span>
                <button id="copy-btn" style="margin-left:.75rem">Copy</button>
            </div>
        </div>

        <div class="card">
            <h2>Your tokens</h2>
            <table>
                <thead>
                <tr><th>Name</th><th>Prefix</th><th>Scopes</th><th>Created</th><th>Expires</th><th>Last used</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="token-rows"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    "use strict";
    let jwt = null;

    const $ = (id) => document.getElementById(id);

    function showError(msg) {
        const box = $("error-box");
        box.textContent = msg;
        box.style.display = "block";
    }

    function fmtDate(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleDateString();
    }

    async function api(method, path, body) {
        const res = await fetch(path, {
            method,
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + jwt,
            },
            body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
            const text = await res.text();
            throw new Error(method + " " + path + " failed (" + res.status + "): " + text);
        }
        return res.json();
    }

    async function loadTokens() {
        const data = await api("GET", "/goapi/v1/auth/tokens");
        const rows = $("token-rows");
        rows.innerHTML = "";
        const tokens = data.tokens || [];
        if (tokens.length === 0) {
            rows.innerHTML = '<tr><td colspan="8" style="color:var(--text-muted)">No tokens yet.</td></tr>';
            return;
        }
        for (const tk of tokens) {
            const tr = document.createElement("tr");
            const status = tk.revoked ? '<span class="badge revoked">revoked</span>' : '<span class="badge active">active</span>';
            tr.innerHTML =
                "<td>" + escapeHtml(tk.name) + "</td>" +
                '<td class="mono">' + escapeHtml(tk.prefix) + "&hellip;</td>" +
                "<td>" + (tk.scopes || []).map(escapeHtml).join("<br>") + "</td>" +
                "<td>" + fmtDate(tk.createdAt) + "</td>" +
                "<td>" + fmtDate(tk.expiresAt) + "</td>" +
                "<td>" + fmtDate(tk.lastUsedAt) + "</td>" +
                "<td>" + status + "</td>" +
                "<td></td>";
            if (!tk.revoked) {
                const btn = document.createElement("button");
                btn.className = "danger";
                btn.textContent = "Revoke";
                btn.onclick = async () => {
                    if (!confirm('Revoke token "' + tk.name + '"? Clients using it will stop working.')) return;
                    try {
                        await api("DELETE", "/goapi/v1/auth/tokens/" + encodeURIComponent(tk.id));
                        await loadTokens();
                    } catch (e) { showError(e.message); }
                };
                tr.lastElementChild.appendChild(btn);
            }
            rows.appendChild(tr);
        }
    }

    function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s == null ? "" : String(s);
        return div.innerHTML;
    }

    $("create-btn").addEventListener("click", async () => {
        const name = $("token-name").value.trim();
        if (!name) { showError("Please give the token a name."); return; }
        $("create-btn").disabled = true;
        try {
            const data = await api("POST", "/goapi/v1/auth/tokens", {
                name: name,
                expiresInDays: parseInt($("token-expiry").value, 10),
            });
            $("new-token-value").textContent = data.token;
            $("new-token-box").style.display = "block";
            $("token-name").value = "";
            await loadTokens();
        } catch (e) {
            showError(e.message);
        } finally {
            $("create-btn").disabled = false;
        }
    });

    $("copy-btn").addEventListener("click", async () => {
        await navigator.clipboard.writeText($("new-token-value").textContent);
        $("copy-btn").textContent = "Copied!";
        setTimeout(() => { $("copy-btn").textContent = "Copy"; }, 1500);
    });

    (async function init() {
        try {
            // Same-origin call: the session cookie authenticates us.
            const res = await fetch("/auth/token", { credentials: "include" });
            if (res.status === 401) {
                $("login-prompt").style.display = "block";
                return;
            }
            if (!res.ok) throw new Error("token mint failed: " + res.status);
            const data = await res.json();
            jwt = data.token;
            $("content").style.display = "block";
            // Re-mint shortly before the JWT expires so long visits keep working.
            const refreshMs = Math.max((data.expires_in_seconds || 900) * 800, 60000);
            setInterval(async () => {
                const r = await fetch("/auth/token", { credentials: "include" });
                if (r.ok) jwt = (await r.json()).token;
            }, refreshMs);
            await loadTokens();
        } catch (e) {
            showError(e.message);
        }
    })();
</script>
</body>
</html>
